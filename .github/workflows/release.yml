name: Signed Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        env:
          OX_KEYSTORE_BASE64: ${{ secrets.OX_KEYSTORE_BASE64 }}
        run: |
          echo "$OX_KEYSTORE_BASE64" | base64 -d > app/oxplayer.jks

      - name: Build signed release APK
        env:
          OX_KEYSTORE_PASSWORD: ${{ secrets.OX_KEYSTORE_PASSWORD }}
          OX_KEY_ALIAS: ${{ secrets.OX_KEY_ALIAS }}
          OX_KEY_PASSWORD: ${{ secrets.OX_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=oxplayer.jks \
            -Pandroid.injected.signing.store.password="$OX_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$OX_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$OX_KEY_PASSWORD"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: oxplayer-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
